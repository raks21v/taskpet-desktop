<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPets - ApplyBee</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="pet-stage" data-tauri-drag-region aria-label="ApplyBee desktop pet">
      <section class="speech-bubble" aria-live="polite">
        <strong>ApplyBee</strong>
        <span>Phase 1 pet is awake!</span>
      </section>
      <button class="pet applybee" type="button" aria-label="ApplyBee">
        <span class="wing wing-left"></span>
        <span class="wing wing-right"></span>
        <span class="antenna antenna-left"></span>
        <span class="antenna antenna-right"></span>
        <span class="body">
          <span class="stripe stripe-one"></span>
          <span class="stripe stripe-two"></span>
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="cheek cheek-left"></span>
          <span class="cheek cheek-right"></span>
        </span>
      </button>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
